<!DOCTYPE html>

<head>

<meta name="theme-color" content="#050505">
<link rel="canonical" href="https://aisaclinic.ir/">

<meta property="og:description" content="کلینیک تخصصی زیبایی آیسا در تهرانپارس، شرق تهران؛ بوتاکس، فیلر، لیزر موهای زائد و جوانسازی پوست زیر نظر پزشک متخصص.">
<meta property="og:locale" content="fa_IR">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/estedad-font@v4.0.0/dist/font-face.css" rel="stylesheet" type="text/css">
<link rel="stylesheet" href="style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MedicalBusiness",
  "name": "کلینیک تخصصی زیبایی آیسا",
  "alternateName": "AISA Premium Cosmetic Clinic",
  "image": "https://aisaclinic.ir/images/clinic_interior.jpg",
  "url": "https://aisaclinic.ir/",
  "telephone": "+989129746855",
  "priceRange": "$$",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "فرجام، نیلوفرانه",
    "addressLocality": "تهرانپارس، تهران",
    "addressRegion": "تهران",
    "addressCountry": "IR"
  },
  "areaServed": ["تهرانپارس", "شرق تهران", "تهران"],
  "openingHours": ["Sa-We 10:00-20:00", "Th 10:00-17:00"],
  "sameAs": [
    "https://www.instagram.com/clinic_aisa",
    "https://t.me/Clinic_aisa"
  ]
}
</script>
</head>
<body>

<div id="preloader">
  <div class="preloader-inner">
    <span class="preloader-logo">AISA</span>
    <div class="preloader-line"><div class="preloader-line-fill"></div></div>
  </div>
</div>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="#hero" class="brand" data-brand></a>
    <nav class="main-nav" id="mainNav" data-nav-root></nav>
    <div class="header-actions">
      <a href="#consultation" class="btn btn-gold btn-sm" data-nav-cta>رزرو مشاوره</a>
      <button class="burger" id="burgerBtn" aria-label="منو">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="mobile-drawer" id="mobileDrawer">
  <div class="mobile-drawer-inner">
    <nav id="mobileNav" data-nav-root-mobile></nav>
    <a href="#consultation" class="btn btn-gold btn-lg" data-nav-cta-mobile>رزرو مشاوره</a>
    <div class="mobile-drawer-foot">
      <span data-brand-mobile></span>
    </div>
  </div>
</div>

<main>

  <section class="hero" id="hero">
    <canvas id="heroCanvas" class="hero-canvas"></canvas>
    <div class="hero-glow hero-glow-1"></div>
    <div class="hero-glow hero-glow-2"></div>
    <div class="hero-glow hero-glow-3"></div>
    <div class="hero-ring"></div>
    <div class="hero-vignette"></div>

    <div class="hero-content">
      <div class="hero-tag" data-hero-tag></div>
      <h1 class="hero-title" data-hero-title></h1>
      <p class="hero-subtitle" data-hero-subtitle></p>
      <div class="hero-actions">
        <a href="#consultation" class="btn btn-gold btn-lg" data-hero-btn-primary></a>
        <a href="#services" class="btn btn-outline btn-lg" data-hero-btn-secondary></a>
      </div>
    </div>

    <div class="hero-scroll-indicator">
      <span></span>
      <p data-hero-scroll></p>
    </div>
  </section>

  <section class="services" id="services">
    <div class="container">
      <div class="section-head">
        <span class="section-kicker" data-services-kicker></span>
        <h2 class="section-title" data-services-title></h2>
        <p class="section-desc" data-services-desc></p>
      </div>
      <div class="services-grid" id="servicesGrid" data-services-root></div>
    </div>
  </section>

  <section class="why-aisa" id="why-aisa">
    <div class="container why-aisa-inner">
      <div class="why-aisa-visual">
        <div class="why-aisa-frame">
          <img data-why-image src="" alt="کلینیک آیسا">
          <div class="why-aisa-badge">
            <strong data-why-badge-number></strong>
            <span data-why-badge-text></span>
          </div>
        </div>
      </div>
      <div class="why-aisa-content">
        <span class="section-kicker" data-why-kicker></span>
        <h2 class="section-title" data-why-title></h2>
        <p class="section-desc" data-why-desc></p>
        <div class="why-list" id="whyList" data-why-root></div>
      </div>
    </div>
  </section>

  <section class="portfolio" id="portfolio">
    <div class="container">
      <div class="section-head">
        <span class="section-kicker" data-portfolio-kicker></span>
        <h2 class="section-title" data-portfolio-title></h2>
        <p class="section-desc" data-portfolio-desc></p>
      </div>
      <div class="portfolio-filters" id="portfolioFilters" data-portfolio-filters-root></div>
      <div class="portfolio-grid" id="portfolioGrid" data-portfolio-root></div>
    </div>
  </section>

  <section class="team" id="team">
    <div class="container">
      <div class="section-head">
        <span class="section-kicker" data-team-kicker></span>
        <h2 class="section-title" data-team-title></h2>
        <p class="section-desc" data-team-desc></p>
      </div>
      <div class="team-grid" id="teamGrid" data-team-root></div>
    </div>
  </section>

  <section class="testimonials" id="testimonials">
    <div class="container">
      <div class="section-head">
        <span class="section-kicker" data-testimonials-kicker></span>
        <h2 class="section-title" data-testimonials-title></h2>
      </div>
      <div class="testimonials-track-wrap">
        <div class="testimonials-track" id="testimonialsTrack" data-testimonials-root></div>
      </div>
      <div class="testimonials-dots" id="testimonialsDots"></div>
    </div>
  </section>

  <section class="blog" id="blog">
    <div class="container">
      <div class="section-head">
        <span class="section-kicker" data-blog-kicker></span>
        <h2 class="section-title" data-blog-title></h2>
        <p class="section-desc" data-blog-desc></p>
      </div>
      <div class="blog-grid" id="blogGrid" data-blog-root></div>
    </div>
  </section>

  <section class="consultation" id="consultation">
    <div class="consultation-bg"></div>
    <div class="container consultation-inner">
      <div class="consultation-text">
        <span class="section-kicker" data-consult-kicker></span>
        <h2 class="section-title" data-consult-title></h2>
        <p class="section-desc" data-consult-desc></p>
        <ul class="consultation-points" id="consultPoints" data-consult-points-root></ul>
      </div>

      <form class="consultation-form" id="consultationForm">
        <input type="text" name="website" id="fwebsite" class="form-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form-row">
          <div class="form-field">
            <label for="fname">نام و نام خانوادگی</label>
            <input type="text" id="fname" name="fname" required placeholder="مثال: مریم احمدی">
          </div>
          <div class="form-field">
            <label for="fphone">شماره تماس</label>
            <input type="tel" id="fphone" name="fphone" required placeholder="۰۹۱۲xxxxxxx">
          </div>
        </div>
        <div class="form-field">
          <label for="fservice">خدمت مورد نظر</label>
          <select id="fservice" name="fservice" data-consult-service-select></select>
        </div>
        <div class="form-field">
          <label for="fmsg">توضیحات (اختیاری)</label>
          <textarea id="fmsg" name="fmsg" rows="3" placeholder="توضیح کوتاهی درباره درخواست خود بنویسید..."></textarea>
        </div>
        <button type="submit" class="btn btn-gold btn-lg btn-block">
          <span>ثبت درخواست مشاوره</span>
        </button>
        <p class="form-note">تیم آیسا در کوتاه‌ترین زمان با شما تماس خواهد گرفت.</p>
      </form>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-top">
      <div class="footer-brand">
        <span class="brand" data-footer-brand></span>
        <p data-footer-tagline></p>
      </div>
      <div class="footer-cols" id="footerCols" data-footer-cols-root></div>
    </div>
    <div class="footer-bottom">
      <p data-footer-copyright></p>
      <div class="footer-social" id="footerSocial" data-footer-social-root></div>
    </div>
  </div>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">&times;</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&#8249;</button>
  <div class="lightbox-content" id="lightboxContent"></div>
  <button class="lightbox-nav lightbox-next" id="lightboxNext">&#8250;</button>
</div>

<div class="toast" id="toast"></div>

<script src="content.js"></script>
<script src="main.js"></script>
</body>
</html>
